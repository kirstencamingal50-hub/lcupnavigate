[build]
  command = "node scripts/build-netlify.mjs"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/index.php"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin-setup.php"
  to = "/.netlify/functions/api?resource=admin/bootstrap"
  status = 200
  force = true

[[headers]]
  for = "/pages/admin/login.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    Pragma = "no-cache"
    Expires = "0"
