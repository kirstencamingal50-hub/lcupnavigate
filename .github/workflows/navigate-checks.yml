name: NaviGATE checks

on:
  push:
    branches:
      - main
      - fix/supabase-admin-users-integration
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Check Netlify Function syntax
        run: |
          node --check netlify/functions/api.mjs
          node --check netlify/functions/_shared/authorization.mjs
          node --check netlify/functions/_shared/mutations.mjs
          node --check netlify/functions/_shared/media.mjs
      - name: Build Netlify deployment
        run: npm run build:netlify
