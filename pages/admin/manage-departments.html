<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Manage Departments - NaviGATE Admin</title><script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0,1,-50,200"><link rel="stylesheet" href="../../assets/css/style.css?v=departments-admin"><link rel="stylesheet" href="../../assets/css/admin.css?v=departments-admin"><script src="../../assets/js/campus-api.js"></script><script src="../../assets/js/admin/admin-auth.js"></script></head>
<body class="admin-page min-h-screen"><div data-component="header"></div><main class="admin-main">
<div class="admin-page-heading"><div><h1 class="text-xl font-bold">Departments</h1><p>Manage department profiles and assign each department to one or more campus buildings and rooms.</p></div><a href="dashboard.html" class="text-xs text-blue-600 font-bold">Back to Dashboard</a></div>
<section class="admin-form-panel rounded-2xl p-5 mb-5"><h2 id="form-title" class="text-sm font-bold">Add Department</h2><form id="department-form" class="mt-4 grid gap-3 md:grid-cols-2">
<input type="hidden" name="id"><label class="text-xs font-bold text-slate-600">Department name<input name="name" required maxlength="180" class="mt-1 w-full rounded-lg border-slate-300 text-sm"></label>
<label class="text-xs font-bold text-slate-600">Contact email<input name="contact_email" type="email" maxlength="254" class="mt-1 w-full rounded-lg border-slate-300 text-sm"></label>
<label class="text-xs font-bold text-slate-600">Contact phone<input name="contact_phone" maxlength="40" class="mt-1 w-full rounded-lg border-slate-300 text-sm"></label>
<label class="text-xs font-bold text-slate-600">Office hours<input name="office_hours" maxlength="500" placeholder="e.g. Monday–Friday, 8 AM–5 PM" class="mt-1 w-full rounded-lg border-slate-300 text-sm"></label>
<label class="md:col-span-2 text-xs font-bold text-slate-600">Description<textarea name="description" rows="3" maxlength="4000" class="mt-1 w-full rounded-lg border-slate-300 text-sm"></textarea></label>
<label class="md:col-span-2 text-xs font-bold text-slate-600">Photo path or URL (optional)<input name="image_path" maxlength="255" class="mt-1 w-full rounded-lg border-slate-300 text-sm" placeholder="Storage object path or https://…"></label>
<div class="md:col-span-2 border rounded-xl p-4"><div class="flex items-center justify-between gap-2"><h3 class="text-sm font-bold">Building and room assignments</h3><button type="button" id="add-assignment" class="text-sm font-bold text-blue-700">+ Add another building</button></div><div id="assignments" class="grid gap-3 mt-3"></div><p class="text-xs text-slate-500 mt-2">A department can have multiple building assignments. Add a separate row for each location.</p></div>
<div class="md:col-span-2 flex gap-2"><button class="rounded-lg bg-blue-700 text-white font-bold px-5 py-2" type="submit">Save Department</button><button class="rounded-lg border px-5 py-2" type="button" id="reset-form">Clear</button><span id="form-status" class="text-sm self-center" role="status"></span></div>
</form></section>
<section class="admin-form-panel rounded-2xl p-5"><h2 class="text-sm font-bold mb-3">Existing Departments</h2><div id="department-list" class="grid gap-3"><p class="text-sm text-slate-500">Loading…</p></div></section>
</main><div data-component="bottom-nav"></div><script src="../../assets/js/app.js?v=departments-admin"></script><script src="../../assets/js/admin/departments.js?v=departments-admin"></script></body></html>
