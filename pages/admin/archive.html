<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archived Records - NaviGATE LCUP</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
  <link rel="stylesheet" href="../../assets/css/style.css?v=20261115-symbol-font">
  <link rel="stylesheet" href="../../assets/css/admin.css?v=20261118-archive-sidebar">
  <script src="../../assets/js/campus-api.js"></script>
  <script src="../../assets/js/admin/admin-auth.js"></script>
  <link rel="stylesheet" href="../../assets/css/admin-ui-polish.css?v=20261118-archive-sidebar">
</head>
<body class="admin-page min-h-screen">
  <div data-component="header"></div>
  <main class="admin-main">
    <div class="admin-page-heading">
      <div>
        <h1 class="text-2xl font-black text-slate-900">Archived records</h1>
        <p class="text-xs text-slate-500">Manage archived buildings, facilities, rooms, and offices. Restore records to the active catalog or permanently delete them.</p>
      </div>
      <div class="admin-page-actions"><button type="button" class="admin-button-secondary" data-archive-refresh><span class="material-symbols-rounded" aria-hidden="true">refresh</span>Refresh archive</button></div>
    </div>
    <section aria-label="Archived campus records">
      <div class="flex flex-wrap gap-2 mb-3" role="group" aria-label="Filter archived records">
        <button type="button" class="admin-button-primary" data-archive-type="all" aria-pressed="true">All</button>
        <button type="button" class="admin-button-secondary" data-archive-type="building" aria-pressed="false">Buildings</button>
        <button type="button" class="admin-button-secondary" data-archive-type="facility" aria-pressed="false">Facilities</button>
        <button type="button" class="admin-button-secondary" data-archive-type="room" aria-pressed="false">Rooms and Offices</button>
      </div>
      <div id="admin-archive-list" class="admin-data-panel p-4" aria-live="polite"><p class="admin-loading">Loading archived records…</p></div>
    </section>
  </main>
  <script src="../../assets/js/app.js?v=20261118-archive-sidebar"></script>
  <script src="../../assets/js/admin/admin-archive.js?v=20261118-archive-sidebar"></script>
</body>
</html>
