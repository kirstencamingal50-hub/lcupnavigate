<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Facilities - Admin</title>
  
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet" href="../../assets/css/style.css?v=20261115-symbol-font" />
  <link rel="stylesheet" href="../../assets/css/admin.css?v=20261105-admin-ux" />
  <link rel="stylesheet" href="../../assets/css/admin-ui-polish.css?v=20261123-edit-photo-details-final" />
  <script src="../../assets/js/campus-api.js"></script>
  <script src="../../assets/js/admin/admin-auth.js"></script>
</head>
<body class="admin-page min-h-screen">

  <div data-component="header"></div>

  <main class="admin-main">
    <div class="admin-page-heading">
      <div><h1 class="text-xl font-bold">Facilities</h1><p>Add and update campus offices and other mapped facilities.</p></div>
      <a href="dashboard.html" class="text-xs text-blue-600 font-bold hover:underline">Back to Dashboard</a>
    </div>

    <section data-catalog-add-panel hidden class="admin-form-panel rounded-2xl p-5" aria-labelledby="add-facility-title">
      <h2 id="add-facility-title" class="text-sm font-bold">Add Facility</h2>
      <form id="add-facility-form" class="mt-4 grid gap-3 md:grid-cols-2">
        <label class="text-[10px] font-bold uppercase tracking-wide text-slate-500">Facility Name
          <input name="name" required maxlength="150" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm text-slate-800" />
        </label>
        <label class="text-[10px] font-bold uppercase tracking-wide text-slate-500">Building
          <select name="buildingId" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm text-slate-800"></select>
        </label>
        <label class="text-[10px] font-bold uppercase tracking-wide text-slate-500">Category
          <select name="category_ids" multiple required size="5" aria-describedby="category-help" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm text-slate-800"></select><small id="category-help" class="mt-1 block text-xs text-slate-500">Select one or more categories. Hold Ctrl (Windows) or Command (Mac) to choose multiple.</small>
        </label>
        <label class="text-[10px] font-bold uppercase tracking-wide text-slate-500">Floor Level<select name="floor" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm text-slate-800"><option value="Ground Level">Ground Level</option><option value="2nd Floor">2nd Floor</option><option value="3rd Floor">3rd Floor</option><option value="4th Floor">4th Floor</option><option value="5th Floor">5th Floor</option><option value="6th Floor">6th Floor</option><option value="7th Floor">7th Floor</option><option value="8th Floor">8th Floor</option><option value="9th Floor">9th Floor</option><option value="10th Floor">10th Floor</option><option value="Basement">Basement</option></select>
        </label>
        <label class="text-[10px] font-bold uppercase tracking-wide text-slate-500">Maximum capacity
          <input name="capacity" type="number" min="0" value="0" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm text-slate-800" />
        </label>
        <label class="text-[10px] font-bold uppercase tracking-wide text-slate-500">Facility Photo
          <input name="photo" type="file" accept="image/*" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm text-slate-800" />
          <img data-photo-preview hidden alt="Facility photo preview" class="mt-2 max-h-40 rounded-lg object-cover" />
        </label>
        <label class="text-[10px] font-bold uppercase tracking-wide text-slate-500 md:col-span-2">Full description
          <textarea name="description" rows="4" maxlength="4000" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm text-slate-800"></textarea>
        </label>
        
        <label class="text-[10px] font-bold uppercase tracking-wide text-slate-500">Contact email
          <input name="contact_email" type="email" maxlength="254" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm text-slate-800" />
        </label>
        <label class="text-[10px] font-bold uppercase tracking-wide text-slate-500">Contact phone
          <input name="contact_phone" type="tel" maxlength="40" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm text-slate-800" />
        </label>
        
        <label class="text-[10px] font-bold uppercase tracking-wide text-slate-500">Service hours
          <select name="service_hours" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm text-slate-800"><option value="">Select service hours</option><option value="8:00 AM – 5:00 PM">8:00 AM – 5:00 PM</option><option value="7:00 AM – 4:00 PM">7:00 AM – 4:00 PM</option><option value="8:00 AM – 12:00 PM">8:00 AM – 12:00 PM</option><option value="1:00 PM – 5:00 PM">1:00 PM – 5:00 PM</option><option value="24 hours">24 hours</option><option value="By appointment">By appointment</option><option value="Varies">Varies</option></select>
        </label>
        <label class="text-[10px] font-bold uppercase tracking-wide text-slate-500">Access hours
          <input name="access_hours" maxlength="500" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm text-slate-800" />
        </label>
        <label class="text-[10px] font-bold uppercase tracking-wide text-slate-500">Days open
          <select name="days_open" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm text-slate-800"><option value="">Select days open</option><option value="Monday – Friday">Monday – Friday</option><option value="Monday – Saturday">Monday – Saturday</option><option value="Monday – Sunday">Monday – Sunday</option><option value="Weekdays only">Weekdays only</option><option value="Weekends only">Weekends only</option><option value="By appointment">By appointment</option><option value="Closed">Closed</option></select>
        </label>
        <label class="text-[10px] font-bold uppercase tracking-wide text-slate-500">Lunch break
          <select name="lunch_break" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm text-slate-800"><option value="">Select lunch hours</option><option value="12:00 PM – 1:00 PM">12:00 PM – 1:00 PM</option><option value="12:00 PM – 12:30 PM">12:00 PM – 12:30 PM</option><option value="12:00 PM – 1:30 PM">12:00 PM – 1:30 PM</option><option value="No lunch break">No lunch break</option><option value="Varies">Varies</option></select>
        </label>
        
        <label class="text-[10px] font-bold uppercase tracking-wide text-slate-500">Accessibility information
          <select name="accessibility_status" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm text-slate-800"><option value="">Not recorded</option><option value="1">Accessible</option><option value="0">Not accessible</option></select>
        </label>
        
        <fieldset class="md:col-span-2 rounded-xl border border-blue-100 bg-blue-50/60 p-4"><legend class="px-1 text-xs font-bold text-slate-800">Accessibility features</legend><p class="mb-3 text-xs text-slate-500">Select the accessibility features confirmed for this room or facility.</p><div class="grid gap-2 sm:grid-cols-2 lg:grid-cols-3"><label class="flex items-center gap-2 text-xs font-medium normal-case text-slate-700"><input type="checkbox" name="accessibility_features" value="wheelchair_accessibility"> Wheelchair accessibility</label><label class="flex items-center gap-2 text-xs font-medium normal-case text-slate-700"><input type="checkbox" name="accessibility_features" value="elevator"> Elevator</label><label class="flex items-center gap-2 text-xs font-medium normal-case text-slate-700"><input type="checkbox" name="accessibility_features" value="accessible_restroom"> Accessible restroom</label><label class="flex items-center gap-2 text-xs font-medium normal-case text-slate-700"><input type="checkbox" name="accessibility_features" value="accessible_parking"> Accessible parking</label><label class="flex items-center gap-2 text-xs font-medium normal-case text-slate-700"><input type="checkbox" name="accessibility_features" value="handrails"> Handrails</label><label class="flex items-center gap-2 text-xs font-medium normal-case text-slate-700"><input type="checkbox" name="accessibility_features" value="braille_signage"> Braille signage</label></div></fieldset><label class="text-[10px] font-bold uppercase tracking-wide text-slate-500 md:col-span-2">Accessibility details
          <textarea name="accessibility_details" rows="2" maxlength="1000" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm text-slate-800"></textarea>
        </label>
        <div class="md:col-span-2 flex items-center justify-between gap-3">
          <p id="facility-form-status" class="text-xs text-slate-500" role="status" aria-live="polite"></p>
          <button type="submit" class="rounded-lg bg-blue-600 px-4 py-2 text-xs font-bold text-white hover:bg-blue-700">Add Facility</button>
        </div>
      </form>
    </section>

    <div id="facilities-list" class="admin-data-panel p-2 sm:p-4"><p class="p-5 text-center text-sm text-slate-500">NaviGATE catalog is loading</p></div>
    <script>
      (() => {
        const panel = document.getElementById('facilities-list');
        const showProblem = message => { if (panel) panel.innerHTML = '<div class="p-5 text-center text-sm text-red-700"><strong>The campus list did not start correctly.</strong><p class="mt-1"></p></div>'; if (panel) panel.querySelector('p').textContent = message; };
        window.addEventListener('error', event => { if (/catalog\.js/.test(event.filename || '') || !event.filename) showProblem(event.message || 'A JavaScript error stopped the page.'); });
        window.addEventListener('unhandledrejection', event => showProblem(event.reason?.message || String(event.reason || 'An unhandled request failed.')));
      })();
    </script>
  </main>

  <script src="../../assets/js/admin/admin-photos.js"></script>
  <script src="../../assets/js/admin/catalog.js?v=20261123-remove-directory-photo-option"></script>
  <script src="../../assets/js/app.js?v=20261118-remove-department-nav"></script>
</body>
</html>
