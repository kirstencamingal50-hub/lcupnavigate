<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Campus Directory - NaviGATE LCUP</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet" href="../assets/css/style.css?v=20261022-edge-category-minimal-2251">
</head>
<body class="directory-page min-h-screen pb-28 font-sans">
  <div data-component="header"></div>
  <main class="directory-main">
    <section class="directory-hero">
      <div>
        <p class="directory-eyebrow"><span class="material-symbols-rounded" aria-hidden="true">explore</span> Find your way around</p>
        <h1>Campus Directory</h1>
        <p class="directory-intro">Browse campus buildings, facilities, and rooms in one place.</p>
      </div>
      <div class="directory-search-wrap">
        <label for="directory-search">Search the directory</label>
        <div class="directory-search-control">
          <span class="material-symbols-rounded" aria-hidden="true">search</span>
          <input type="search" id="directory-search" placeholder="Name, service, building, or room…" autocomplete="off">
        </div>
      </div>
    </section>
    <section class="directory-browser" aria-label="Directory results">
      <div class="directory-toolbar">
        <div id="directory-filters" class="directory-filters" role="group" aria-label="Filter by type">
          <button type="button" data-directory-kind="all" aria-pressed="true">All</button>
          <button type="button" data-directory-kind="building" aria-pressed="false">Buildings</button>
          <button type="button" data-directory-kind="facility" aria-pressed="false">Facilities</button>
          <button type="button" data-directory-kind="room" aria-pressed="false">Rooms</button>
        </div>
        <div class="directory-result-tools">
          <p id="directory-count" role="status" aria-live="polite">Loading directory…</p>
          <label for="directory-sort" class="sr-only">Sort results</label>
          <select id="directory-sort" aria-label="Sort results">
            <option value="name">Name A–Z</option>
            <option value="name-desc">Name Z–A</option>
            <option value="type">Type</option>
          </select>
        </div>
      </div>
      <div id="directory-category-filter" class="directory-category-notice" hidden>
        <span id="directory-category-label"></span>
        <button type="button" id="clear-directory-category">Clear category</button>
      </div>
      <div id="directory-list" class="directory-grid" aria-live="polite"></div>
    </section>
  </main>
  <div data-component="bottom-nav"></div>
  <script src="../assets/js/deployment-config.js"></script>
  <script src="../assets/js/campus-api.js"></script>
  <script type="module" src="../assets/js/directory.js?v=20261022-edge-category-minimal-2251"></script>
  <script src="../assets/js/app.js?v=20261021-admin-settings"></script>
</body>
</html>
