<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Campus Directory - NaviGATE LCUP</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet" href="../assets/css/style.css?v=20261022-edge-category-minimal-2251">
</head>
<body class="directory-page min-h-screen pb-28 font-sans">
  <div data-component="header"></div>
  <main class="directory-main">
    <section class="directory-hero">
      <div class="directory-hero-copy">
        <p class="directory-eyebrow"><span class="material-symbols-rounded" aria-hidden="true">auto_awesome</span> Your campus guide</p>
        <h1>Where do you need to go?</h1>
        <p class="directory-intro">Search campus places, discover services, and find the right building or room with ease.</p>
        <div class="directory-search-wrap">
          <label for="directory-search">Ask the campus directory</label>
          <div class="directory-search-control">
            <span class="material-symbols-rounded" aria-hidden="true">search</span>
            <input type="search" id="directory-search" placeholder="Try a building, office, service, or room…" autocomplete="off">
          </div>
        </div>
      </div>
    </section>
    <section class="directory-browser" aria-label="Directory results">
      <div class="directory-toolbar">
        <div id="directory-filters" class="directory-filters" role="group" aria-label="Filter by type">
          <button type="button" data-directory-kind="all" aria-pressed="true">All</button>
          <button type="button" data-directory-kind="building" aria-pressed="false">Buildings</button>
          <button type="button" data-directory-kind="facility" aria-pressed="false">Facilities</button>
          <button type="button" data-directory-kind="room" aria-pressed="false">Rooms</button>
        </div>
        <div class="directory-result-tools">
          <div class="directory-3d-control" id="directory3DControl">
            <button type="button" id="directory3DToggle" aria-expanded="false" aria-controls="directory3DMenu">
              <span class="material-symbols-rounded" aria-hidden="true">view_in_ar</span> 3D View
              <span class="material-symbols-rounded" aria-hidden="true">expand_more</span>
            </button>
            <div id="directory3DMenu" class="directory-3d-menu" hidden><p>Select a campus location with an available 3D model.</p><div id="directory3DOptions"></div></div>
          </div>
          <p id="directory-count" role="status" aria-live="polite">Loading directory…</p>
          <label for="directory-sort" class="sr-only">Sort results</label>
          <select id="directory-sort" aria-label="Sort results">
            <option value="name">Name A–Z</option>
            <option value="name-desc">Name Z–A</option>
            <option value="type">Type</option>
          </select>
        </div>
      </div>
      <div id="directory-category-filter" class="directory-category-notice" hidden>
        <span id="directory-category-label"></span>
        <button type="button" id="clear-directory-category">Clear category</button>
      </div>
      <div id="directory-list" class="directory-grid" aria-live="polite"></div>
    </section>
  </main>
  <div data-component="bottom-nav"></div>
  <dialog id="directory3DDialog" class="directory-3d-dialog" aria-labelledby="directory3DTitle">
    <div class="directory-3d-dialog-head"><div><span class="directory-3d-eyebrow">Interactive model</span><h2 id="directory3DTitle">3D View</h2></div><button type="button" id="directory3DClose" aria-label="Close 3D view"><span class="material-symbols-rounded">close</span></button></div>
    <model-viewer id="directory3DViewer" camera-controls auto-rotate shadow-intensity="1" exposure="1" loading="eager"></model-viewer>
    <p class="directory-3d-help">Drag to rotate. Scroll or pinch to zoom.</p>
  </dialog>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <script src="../assets/js/campus-api.js"></script>
  <script type="module" src="../assets/js/directory.js?v=20261115-category-aliases"></script>
  <script src="../assets/js/app.js?v=20261118-admin-navigation"></script>
</body>
</html>
